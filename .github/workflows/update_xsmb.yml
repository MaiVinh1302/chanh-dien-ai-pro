name: Auto Update XSMB Forecast Data

on:
  schedule:
    # 18:45 hàng ngày giờ Việt Nam (UTC+7) = 11:45 UTC
    - cron: "45 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "xsmb-forecast-app/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r xsmb-forecast-app/requirements.txt

      - name: Run XSMB sync and forecast
        run: |
          python xsmb-forecast-app/auto_update.py

      - name: Commit & push updated forecast data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add xsmb-forecast-app/data/
          if ! git diff --staged --quiet; then
            git commit -m "chore(xsmb): auto-update daily draw & forecast"
            git push
          else
            echo "No new XSMB data to commit."
          fi
